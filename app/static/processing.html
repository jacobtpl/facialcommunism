<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processing Image</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
      .lds-ring {
        display: inline-block;
        position: fixed;
        top: 50%;
        left: 50%;
        height: 100px;
        width: 100px;
        margin-top: -50px;
        margin-left: -50px;
        z-index: 10;
      }
      .lds-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 51px;
        height: 51px;
        margin: 6px;
        border: 6px solid #fff;
        border-radius: 50%;
        animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: #dc3545 transparent transparent transparent;
      }
      .lds-ring div:nth-child(1) {
        animation-delay: -0.45s;
      }
      .lds-ring div:nth-child(2) {
        animation-delay: -0.3s;
      }
      .lds-ring div:nth-child(3) {
        animation-delay: -0.15s;
      }
      @keyframes lds-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .message {
        text-align: center;
        margin-top: 80px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="message">
        <h1>Processing Your Image</h1>
        <p>Please wait while we process your image. This may take up to a minute depending on the complexity of the image.</p>
        <p id="status-message">Detecting faces and processing...</p>
      </div>
      <div id="loadingcircles" class="lds-ring"><div></div><div></div><div></div><div></div></div>
    </div>
    
    <script>
      // Poll for status every 2 seconds
      function checkStatus() {
        fetch('/status')
          .then(response => response.json())
          .then(data => {
            if (data.status === "completed") {
              window.location.href = "/final";
            } else if (data.status === "failed") {
              document.getElementById("status-message").textContent = "Error processing image. Please try again with a different image.";
              document.getElementById("loadingcircles").style.display = "none";
            } else {
              // Still processing, check again in 2 seconds
              setTimeout(checkStatus, 2000);
            }
          })
          .catch(error => {
            console.error('Error checking status:', error);
            setTimeout(checkStatus, 2000);
          });
      }
      
      // Start checking status when page loads
      document.addEventListener('DOMContentLoaded', function() {
        checkStatus();
      });
    </script>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
  </body>
</html>
